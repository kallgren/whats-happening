<!-- iOS home-screen pin -->

<meta name="mobile-web-app-capable" content="yes">

<style>
  :root {
    --bg: #faf9f7;
    --card: #fff;
    --ink: #1a1a1a;
    --dim: #6b6b6b;
    --line: #e4e1dc;
    --accent: #1b4d3e;
    --skel: #e8e4dd;
    --skel-hi: #f4f1ec;
    font-size: 16px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 0 0 3rem;
    background: var(--bg); color: var(--ink);
    font: 1rem/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  .wrap { max-width: 72rem; margin: 0 auto; padding: 0 1rem; }
  a { color: inherit; }

  section { margin: 0 0 1.75rem; }
  h2 {
    font-size: .75rem; text-transform: uppercase; letter-spacing: .09em;
    color: var(--dim); margin: 0 0 .6rem;
  }

  .card {
    background: var(--card); border: 1px solid var(--line);
    border-radius: 12px; padding: .9rem; margin-bottom: 1rem;
  }

  .linkrow { display: flex; flex-wrap: wrap; gap: .4rem; }
  .main .linkrow { margin-top: 1rem; }
  .chip {
    background: var(--card); border: 1px solid var(--line); border-radius: 999px;
    padding: .3rem .7rem; font-size: .85rem; text-decoration: none;
  }
  .chip:hover { border-color: var(--accent); color: var(--accent); }

  /* --- skeletons ---------------------------------------------------------
     Every bar is a placeholder for data a later ticket fills in, and is
     aria-hidden: the shape is for the eye only, with nothing behind it to
     announce. Note that nothing currently distinguishes "waiting for data"
     from "source broke" — see ticket 07, point 5. */
  .sk {
    display: block; background: var(--skel); border-radius: 4px;
    height: .7rem; width: 100%;
    background-image: linear-gradient(90deg, var(--skel) 0%, var(--skel-hi) 50%, var(--skel) 100%);
    background-size: 200% 100%;
    animation: shimmer 1.8s ease-in-out infinite;
  }
  @keyframes shimmer {
    from { background-position: 150% 0; }
    to   { background-position: -50% 0; }
  }
  @media (prefers-reduced-motion: reduce) {
    .sk { animation: none; }
  }
  .sk-title { height: .85rem; margin-bottom: .35rem; }
  .sk-w90 { width: 90%; } .sk-w80 { width: 80%; }
  .sk-w70 { width: 70%; } .sk-w60 { width: 60%; } .sk-w45 { width: 45%; }

  /* --- page header: title left, 7-day forecast right --- */
  .pagehead {
    border-bottom: 1px solid var(--line);
    padding: 1.5rem 0 1.25rem; margin-bottom: 1.5rem;
    display: flex; justify-content: space-between; align-items: flex-end;
    gap: 2rem; flex-wrap: wrap;
  }
  .pagehead h1 { margin: 0 0 .15rem; font-size: 1.5rem; letter-spacing: -.01em; }
  .pagehead .sub { color: var(--dim); font-size: .8rem; margin: 0; }
  .ph-wx { flex: 1 1 20rem; max-width: 28rem; }
  .ph-wx a { text-decoration: none; display: block; }

  .wx { display: flex; justify-content: space-between; gap: .5rem; }
  .wx div { flex: 1; display: flex; flex-direction: column; align-items: center; gap: .3rem; }
  .wx .ic { width: 1.6rem; height: 1.6rem; border-radius: 50%; }
  .wx .t { width: 1.6rem; height: .6rem; }
  .wx .dn { width: 1.5rem; height: .5rem; }

  /* --- desktop: events left, link cards right --- */
  .cols { display: block; }
  @media (min-width: 60rem) {
    .cols { display: grid; grid-template-columns: minmax(0, 1fr) 20rem; gap: 2.5rem; align-items: start; }
    .aside { position: sticky; top: 1rem; }
    .aside section:last-child { margin-bottom: 0; }
  }

  /* --- events: horizontal day slices ---
     The only event view for now — a grid and a plain list were built alongside
     it and dropped again, since this is the one worth testing against real
     data. Desktop scrolls days sideways; below 60rem the slices stack into a
     plain day-grouped list, which is the whole mobile story. Whether sideways
     days survive real event volumes is ticket 01's call. */
  .day {
    margin: 1.25rem 0 .25rem;
    display: flex; justify-content: space-between; align-items: center; gap: .5rem;
  }
  .day .sk { height: .8rem; width: 8rem; }
  .day .dw { width: 3rem; }

  .row {
    display: flex; gap: .7rem; align-items: baseline;
    padding: .5rem 0; border-bottom: 1px solid var(--line);
  }
  .row .time { flex: 0 0 auto; width: 3.1rem; }
  .row .body { flex: 1; min-width: 0; }

  @media (min-width: 60rem) {
    .slicecard {
      background: var(--card); border: 1px solid var(--line);
      border-radius: 12px; padding: .9rem;
    }
    .slices {
      display: flex; gap: 1.25rem; overflow-x: auto; padding-bottom: .75rem;
      scroll-snap-type: x proximity;
    }
    .slices .slice {
      flex: 0 0 15rem; scroll-snap-align: start;
      border-left: 1px solid var(--line); padding-left: 1rem;
    }
    .slices .slice:first-child { border-left: 0; padding-left: 0; }
    .slices .day { margin-top: 0; }
    .slices .row { flex-direction: column; align-items: stretch; gap: .3rem; }
    .slices .row .time { width: 3rem; }
  }
</style>
</head>
<body>

        <div class="linkrow">

<script>
// Today's date, computed in the browser rather than baked in — a static file
// has no build step yet (ticket 08), and a hardcoded date would be wrong by
// tomorrow. If this script never runs the line is simply absent; nothing else
// on the page depends on it.
(function () {
  var d = new Date().toLocaleDateString("sv-SE", {
    weekday: "long", day: "numeric", month: "long",
  });
  document.getElementById("idag").textContent = d.charAt(0).toUpperCase() + d.slice(1);
})();
</script>
