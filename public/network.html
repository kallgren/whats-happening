<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>Nätverk</title>
<meta name="description" content="Anteckningar om folk och saker att göra — sparade i den här webbläsaren.">

<!-- Same manifest as the hub: its scope is "/", so /network is inside the
     installed app and a home-screen launch keeps both pages in one window. -->
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#faf9f7">

<link rel="icon" type="image/svg+xml" href="/icons/icon.svg">
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/icon-180.png">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Nätverk">

<!-- The hub's stylesheet first: the custom properties and the typography are
     most of what makes this read as the same app. network.css only adds the
     grid. -->
<link rel="stylesheet" href="/style.css">
<link rel="stylesheet" href="/network.css">
</head>
<body>

<div class="wrap">

  <header class="pagehead">
    <div class="ph-title">
      <h1>Nätverk</h1>
      <p class="sub">Anteckningar — sparade bara i den här webbläsaren</p>
    </div>

    <!-- Ticket 05. In the header rather than beside the grid, and that is not
         only layout: when the store is corrupt the grid is hidden and these two
         are the only things left that can help. Export is then the rescue — it
         writes the damaged bytes to a file before anything touches them — and
         import is the recovery. Both stay live while the page is frozen. -->
    <div class="ph-acts">
      <!-- Ticket 07. Icons, not labels — but the words do not disappear, they
           move to aria-label and title, so the button is still named for a
           screen reader and still says what it is on hover. The SVG is inline
           rather than an icon font or a sprite file for the same reason
           SortableJS is vendored: no build step, and no fetch that can fail.
           Empty squares where the recovery buttons should be is the one
           failure this page cannot afford. aria-hidden on the glyph itself,
           so the accessible name is the label and not the label read twice. -->
      <button type="button" class="act" id="export" aria-label="Exportera" title="Exportera">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/>
        </svg>
      </button>
      <button type="button" class="act" id="import" aria-label="Importera" title="Importera">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path d="M12 15V3"/><path d="M7 8l5-5 5 5"/><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/>
        </svg>
      </button>
      <!-- The real file picker. A button opens it, because a bare file input
           cannot be styled and reads as a form field on a page that has none. -->
      <input type="file" id="importfile" accept="application/json,.json" hidden>
    </div>
  </header>

  <!-- Ticket 02. The banner stands *above* the grid rather than inside it:
       when it appears the grid is hidden, because a store that cannot be read
       must not be silently replaced by an empty one. -->
  <div class="failed" id="trouble" hidden></div>

  <!-- The "+" tile is the grid's last cell, not a button above it — one click
       and you are typing in a new note. network.js renders the note cards ahead
       of it, so the tile is always the empty slot at the end. -->
  <div class="notes" id="notes">
    <button type="button" class="note-add" id="add" aria-label="Ny anteckning">+</button>
  </div>

  <p class="quiet" id="empty" hidden>Inga anteckningar ännu — klicka på + för att skriva den första.</p>

  <footer class="pagefoot">
    <p class="hotkey"><a href="/">Vad händer</a> — eller tryck <kbd>h</kbd></p>
    Anteckningarna finns bara i den här webbläsaren. Rensar du webbplatsdata försvinner de —
    exportera därför med jämna mellanrum.
  </footer>

</div>

<!-- SortableJS 1.15.7, MIT, vendored verbatim from the 1.15.7 git tag (ticket
     03). Not a CDN and not npm: this page has no build step and must not gain a
     runtime dependency on a third-party host. The UMD build defines
     window.Sortable from an ordinary script tag, which is why it and not the
     ESM build — upstream ships no minified ESM. Its sha256 is recorded beside
     it; verify with `shasum -a 256 -c public/sortable.min.js.sha256` so a
     future bump is a diff rather than an act of faith.

     Classic, not deferred: it runs while the document is parsed, so
     window.Sortable is there by the time the module below runs. -->
<script src="/sortable.min.js"></script>

<!-- A module, so store.js can be a separate file with no build step. Modules
     are deferred, so the DOM is parsed before anything in it runs. -->
<script type="module" src="/network.js"></script>
</body>
</html>
